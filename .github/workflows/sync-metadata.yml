name: Sync repository metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/labels.json'
      - '.github/milestones.json'
      - 'scripts/sync_metadata.py'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ensure live branch exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/live" >/dev/null 2>&1; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/heads/live' -f sha="$main_sha"
          fi
      - name: Create or update labels and milestones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_metadata.py
