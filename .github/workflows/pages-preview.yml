name: Deploy dashboard preview to GitHub Pages

on:
  push:
    branches:
      - release/pages-dashboard-preview-20260928
    paths:
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 45fc7f14a283068e38f5264fa3cac68d916715f0
      - run: python scripts/validate_tracker.py
      - run: node --check assets/app.js
      - run: node --check assets/dashboard-model.js
      - run: node --test tests/dashboard-model.test.cjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 45fc7f14a283068e38f5264fa3cac68d916715f0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy frozen dashboard candidate
        id: deployment
        uses: actions/deploy-pages@v4
